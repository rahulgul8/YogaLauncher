<!doctype html>
<html lang="en" data-look="obsidian" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="/styles.css"><meta name="robots" content="noindex">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{display:grid;grid-template-columns:1fr auto;align-items:center;gap:40px;height:630px;padding:0 88px;box-sizing:border-box;border:1px solid var(--line)}
.og .brand img{width:44px;height:44px;border-radius:12px}.og .brand span{font-size:30px}
.og h1{margin:40px 0 0;font-size:64px;line-height:1.05;max-width:9.5em}
.og p{margin:24px 0 0;color:var(--muted);font-size:20px}
.og .clock{--size:210px;margin:0}
</style></head>
<body><div class="og"><div><span class="brand"><img src="/icon.svg" alt=""><span>Yoga Phone</span></span>
<h1 class="display">A calmer phone, without giving up a useful one.</h1>
<p>A calm home screen for Android &middot; yogaphone.tuwi.in</p></div>
<div class="clock"><span>10</span><span class="colon"><i></i><i></i></span><span>10</span></div></div></body></html>
